[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chesscoach"
version = "0.1.0"
description = "Analyze your chess games with Stockfish, find your mistakes, and practice better moves."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.10",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
chesscoach-cli = "chesscoach.cli:main"

[project.gui-scripts]
chesscoach = "chesscoach.gui.app:main"

[tool.setuptools.packages.find]
include = ["chesscoach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
